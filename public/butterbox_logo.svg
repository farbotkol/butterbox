<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Butterbox Systems</title>
  <desc id="desc">Coastal wave-shaped B mark in dark ocean and sea-glass blue with Butterbox Systems wordmark and Less admin. More good days. tagline.</desc>
  <rect width="720" height="540" fill="#FAF9F6"/>
  <g id="wave-b" transform="translate(0 0)">
    <!-- Top portion of the wave B. -->
    <path fill="#123F4A" d="M210 54 H413 C506 54 559 95 559 173 C559 226 543 262 502 292 C467 317 431 313 408 293 L386 265 C372 250 377 231 389 218 C401 204 416 196 430 183 C461 154 449 119 420 119 C388 117 359 135 333 156 L194 252 V70 C194 61 201 54 210 54 Z"/>
    <!-- Bottom wave and rounded lower bowl. -->
    <path fill="#83B9BC" d="M194 282 C223 257 238 251 262 240 C233 262 216 273 222 284 C230 301 239 289 260 274 C292 250 313 244 329 252 C355 262 370 293 387 312 C414 342 445 348 472 335 C490 326 506 306 520 288 C529 277 538 278 544 282 C563 281 573 303 574 330 V380 C574 407 557 422 537 422 H214 C200 422 194 410 194 396 Z"/>
    <!-- Clear wave seam to emphasize a continuous surf break. -->
    <path d="M228 277 C254 258 282 247 307 253" fill="none" stroke="#FAF9F6" stroke-width="0"/>
  </g>
  <g id="wordmark" fill="#123F4A" text-anchor="middle">
    <text x="360" y="419" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="750" letter-spacing="-3.8">butterbox</text>
    <text x="360" y="459" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" letter-spacing="9">SYSTEMS</text>
    <text x="360" y="503" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Less admin. More good days.</text>
  </g>
</svg>
