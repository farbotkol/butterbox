name: Focused browser tests

# Manually runs selected Playwright tests against a disposable Supabase project and a production build, using the
# same scripts/test-env.mjs command as local and agent runs. It is a diagnostic aid, not a merge gate: the complete
# Verify workflow (ci.yml) still gates every merge. Pull requests that change the test tooling run a small default
# selection to prove the command still works on GitHub runners.
on:
  pull_request:
    paths:
      - ".github/workflows/focused-browser.yml"
      - "scripts/test-env.mjs"
      - "scripts/test-auth.mjs"
      - "playwright.config.mjs"
  push:
    branches:
      - fix/issue-253-roster-browser-stabilization
      - fix/issue-253-test-compatibility
      - fix/issue-253-roster-ui-test-refresh
  workflow_dispatch:
    inputs:
      tests:
        description: "Space-separated locations, e.g. tests/e2e/auth.spec.mjs:7137 tests/e2e/auth.spec.mjs:11554"
        required: false
        default: ""
      grep:
        description: "Playwright test-name pattern"
        required: false
        default: ""
      repeat:
        description: "Run each selected test this many times (1-10)"
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  group: focused-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Start disposable Supabase
        run: node scripts/test-env.mjs up
      - name: Run focused browser tests
        env:
          TESTS: ${{ github.event_name == 'push' && 'tests/e2e/auth.spec.mjs:5214 tests/e2e/auth.spec.mjs:5395 tests/e2e/auth.spec.mjs:6843 tests/e2e/auth.spec.mjs:7271 tests/e2e/auth.spec.mjs:12029 tests/e2e/auth.spec.mjs:7099' || inputs.tests }}
          GREP: ${{ github.event_name == 'pull_request' && 'core pages pass WCAG checks' || inputs.grep }}
          REPEAT: ${{ inputs.repeat || '1' }}
        shell: bash
        run: |
          set -eu
          # Keep the test broker limit (20 locations per invocation).
          # Run all requested locations in batches and preserve an aggregated failure exit code.
          read -r -a locations <<< "$TESTS"
          if [ "${#locations[@]}" -eq 0 ]; then
            locations=("")
          fi
          failed=0
          for ((start=0, batch=1; start<${#locations[@]}; start+=20, batch++)); do
            args=()
            for test in "${locations[@]:start:20}"; do
              if [ -n "$test" ]; then args+=(--test "$test"); fi
            done
            if [ -n "$GREP" ]; then args+=(--grep "$GREP"); fi
            echo "Running focused batch $batch (${#args[@]} arguments)"
            if ! node scripts/test-env.mjs run auth-focused --runner host --repeat "$REPEAT" "${args[@]}" \
              --artifacts "$RUNNER_TEMP/focused-artifacts/batch-$batch"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/focused-artifacts/summary.md" ]; then
            cat "$RUNNER_TEMP/focused-artifacts/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/focused-artifacts
          retention-days: 7
          if-no-files-found: ignore
