name: Check Copilot agent token

on:
  workflow_dispatch:

permissions: {}

jobs:
  check-token:
    if: github.repository == 'farbotkol/butterbox' && github.ref == 'refs/heads/copilot/Development'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report Copilot task-list HTTP status
        shell: bash
        env:
          COPILOT_AGENT_USER_TOKEN: ${{ secrets.COPILOT_AGENT_USER_TOKEN }}
        run: |
          set -euo pipefail

          report() {
            printf '%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          if [[ -z "$COPILOT_AGENT_USER_TOKEN" ]]; then
            report 'COPILOT_AGENT_USER_TOKEN is unavailable. No request was sent.'
            exit 1
          fi

          # Only GitHub token characters can enter the curl configuration on stdin.
          if [[ ! "$COPILOT_AGENT_USER_TOKEN" =~ ^[A-Za-z0-9_]+$ ]]; then
            report 'COPILOT_AGENT_USER_TOKEN has an unexpected format. No request was sent.'
            exit 1
          fi

          if ! status=$(
            printf 'header = "Authorization: Bearer %s"\n' "$COPILOT_AGENT_USER_TOKEN" |
              curl --disable --config - --silent --output /dev/null \
                --write-out '%{http_code}' --connect-timeout 10 --max-time 30 \
                --request GET \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2026-03-10' \
                'https://api.github.com/agents/repos/farbotkol/butterbox/tasks'
          ) || [[ ! "$status" =~ ^[1-5][0-9][0-9]$ ]]; then
            report 'No HTTP status was received from GitHub.'
            exit 1
          fi

          report "GitHub Copilot task list returned HTTP $status."
          [[ "$status" == 200 ]]
