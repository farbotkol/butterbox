name: Check Copilot agent token
on:
  workflow_dispatch:
permissions: {}
jobs:
  check-token:
    if: github.repository == 'farbotkol/butterbox' && github.ref == 'refs/heads/diagnose/305-retained-lease' && github.actor_id == '11307166' && github.triggering_actor == 'farbotkol'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare documented modification and writer filters using GET only
        env:
          COPILOT_AGENT_USER_TOKEN: ${{ secrets.COPILOT_AGENT_USER_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.COPILOT_AGENT_USER_TOKEN;
          if (!token) throw new Error('Copilot credential unavailable');
          const root = 'https://api.github.com/agents/repos/farbotkol/butterbox/tasks';
          const states = new Set(['queued', 'in_progress', 'waiting_for_user']);
          const knownId = 'e80f0b14-620a-4914-8dac-f12059f2421f';
          const logs = [];
          async function get(path, purpose) {
            const response = await fetch(root + path, {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + token, 'X-GitHub-Api-Version': '2026-03-10' },
            });
            const meta = name => {
              const value = response.headers.get(name);
              return value && /^[\da-f:]+$/i.test(value) ? value : null;
            };
            console.log(JSON.stringify({ purpose, status: response.status, requestId: meta('x-github-request-id'),
              remaining: meta('x-ratelimit-remaining'), limit: meta('x-ratelimit-limit'), reset: meta('x-ratelimit-reset') }));
            logs.push(response.status);
            if (!response.ok) return null;
            return { data: await response.json(), next: /rel="?next"?/.test(response.headers.get('link') ?? '') };
          }
          const list = async (params, purpose) => {
            const out = [];
            for (let page = 1; page <= 3; page++) {
              const result = await get('?per_page=100&page=' + page + '&' + params, purpose);
              if (!result) return null;
              const { data, next } = result;
              if (!Array.isArray(data.tasks)) throw new Error('Invalid repository task list');
              out.push(...data.tasks);
              if (!next) {
                if ((data.total_count !== undefined && data.total_count !== out.length) ||
                    (data.total_count === undefined && data.tasks.length === 100) ||
                    new Set(out.map(t => t.id)).size !== out.length) throw new Error('Incomplete repository task list');
                return out;
              }
            }
            throw new Error('Diagnostic pagination cap reached');
          };
          const t = await get('/' + knownId, 'historical-conflicting-session');
          if (t) console.log(JSON.stringify({ knownId, state: t.data.state, created: t.data.created_at,
            updated: t.data.updated_at, sessionCount: t.data.session_count,
            sessions: t.data.sessions?.map(s => ({ id:s.id, state:s.state, updated:s.updated_at })) }));
          const active = await list('state=queued,in_progress,waiting_for_user', 'active');
          for (const filter of ['', 'is_archived=false', 'is_archived=true']) {
            const base = await list(filter, 'baseline ' + filter);
            if (!base) continue;
            const witness = base.find(row => Date.parse(row.updated_at) > Date.parse(row.created_at) + 1000);
            if (!witness) {
              console.log(JSON.stringify({ filter, count: base.length, witness: false }));
              continue;
            }
            const since = new Date(Date.parse(witness.created_at) + 1000).toISOString();
            const recent = await list(filter + (filter ? '&' : '') + 'since=' + encodeURIComponent(since), 'since ' + filter);
            const future = await list(filter + (filter ? '&' : '') + 'since=2099-01-01T00%3A00%3A00Z', 'future ' + filter);
            console.log(JSON.stringify({ filter, count: base.length, active: active?.length,
              historicalKnownInBaseline: base.some(r => r.id === knownId), historicalKnownInActive: active?.some(r => r.id === knownId),
              since, witnessId: witness.id, created: witness.created_at, updated: witness.updated_at,
              witnessInSince: recent?.some(r => r.id === witness.id), recent: recent?.length,
              outOfWindow: recent?.filter(r => !(Date.parse(r.updated_at) >= Date.parse(since))).length,
              omittedExpected: recent && base.filter(r => Date.parse(r.updated_at) >= Date.parse(since) && !recent.some(n => n.id === r.id)).length,
              future: future?.length }));
          }
          console.log(JSON.stringify({ requests: logs.length }));
          JS
