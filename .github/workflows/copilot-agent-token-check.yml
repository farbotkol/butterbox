name: Check Copilot agent token

on:
  workflow_dispatch:

permissions: {}

jobs:
  check-token:
    if: github.repository == 'farbotkol/butterbox' && github.ref == 'refs/heads/diagnose/45104980678-copilot-readonly' && github.actor_id == '11307166'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Copilot task and session states using GET only
        env:
          COPILOT_AGENT_USER_TOKEN: ${{ secrets.COPILOT_AGENT_USER_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.COPILOT_AGENT_USER_TOKEN;
          if (!token) throw new Error('Approved Copilot credential unavailable');
          const root = 'https://api.github.com/agents/repos/farbotkol/butterbox/tasks';
          const id = value => typeof value === 'string' && /^[a-f0-9-]{36}$/i.test(value) ? value : null;
          const state = value => ['completed', 'failed', 'cancelled', 'timed_out', 'idle', 'queued', 'in_progress', 'waiting_for_user'].includes(value) ? value : 'unknown';
          const time = value => typeof value === 'string' && Number.isFinite(Date.parse(value)) ? new Date(value).toISOString() : null;
          async function get(path) {
            const response = await fetch(root + path, {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + token, 'X-GitHub-Api-Version': '2026-03-10' },
            });
            if (!response.ok) throw new Error('Copilot GET returned HTTP ' + response.status);
            if (/rel="?next"?/.test(response.headers.get('link') ?? '')) throw new Error('Copilot list is paginated');
            return response.json();
          }
          const list = await get('?per_page=100');
          if (!Array.isArray(list.tasks) || list.tasks.length >= 100 ||
              (Object.hasOwn(list, 'total_count') && list.total_count !== list.tasks.length)) throw new Error('Incomplete task list');
          console.log(JSON.stringify({ taskCount: list.tasks.length }));
          for (const row of list.tasks.filter(row => row.id === "e80f0b14-620a-4914-8dac-f12059f2421f")) {
            const taskId = id(row.id);
            if (!taskId) throw new Error('Unexpected task identity');
            const task = await get('/' + taskId);
            console.log(JSON.stringify({
              taskId, detailTaskId: id(task.id), listState: state(row.state), state: state(task.state),
              created: time(task.created_at), updated: time(task.updated_at), completed: time(task.completed_at),
              archived: time(task.archived_at), artifactCount: Array.isArray(task.artifacts) ? task.artifacts.length : null,
              sessionCount: task.session_count, sessions: task.sessions?.map(session => ({
                hasHeadRef: Boolean(session.head_ref), hasBaseRef: Boolean(session.base_ref),
                id: id(session.id), taskId: id(session.task_id), state: state(session.state),
                created: time(session.created_at), updated: time(session.updated_at),
                started: time(session.started_at), completed: time(session.completed_at),
              })),
            }));
          }
          JS
