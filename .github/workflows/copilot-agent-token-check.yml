name: Check Copilot agent token

on:
  workflow_dispatch:

permissions: {}

jobs:
  check-token:
    if: github.repository == 'farbotkol/butterbox' && github.ref == 'refs/heads/diagnose/305-retained-lease' && github.actor_id == '11307166' && github.triggering_actor == 'farbotkol'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read current Copilot writer evidence for Issue 305
        env:
          COPILOT_AGENT_USER_TOKEN: ${{ secrets.COPILOT_AGENT_USER_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.COPILOT_AGENT_USER_TOKEN;
          if (!token) throw new Error('Copilot credential unavailable');
          const root = 'https://api.github.com/agents/repos/farbotkol/butterbox/tasks';
          const uuid = value => typeof value === 'string' && /^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(value);
          const stopped = new Set(['completed', 'failed', 'cancelled', 'timed_out']);
          const known = new Set([...stopped, 'idle', 'queued', 'in_progress', 'waiting_for_user']);
          const marker = 'BUTTERBOX_LEASE_RUN=actions_45121500090_1';
          async function get(path) {
            const response = await fetch(root + path, {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + token, 'X-GitHub-Api-Version': '2026-03-10' },
            });
            if (!response.ok) throw new Error('Copilot GET returned HTTP ' + response.status);
            if (/rel="?next"?/.test(response.headers.get('link') ?? '')) throw new Error('Paginated task evidence');
            return response.json();
          }
          async function list() {
            const data = await get('?per_page=100');
            if (!Array.isArray(data.tasks) || data.tasks.length >= 100 ||
                (Object.hasOwn(data, 'total_count') && data.tasks.length !== data.total_count) ||
                data.tasks.some(task => !uuid(task.id) || !known.has(task.state)) ||
                new Set(data.tasks.map(task => task.id)).size !== data.tasks.length) throw new Error('Incomplete task inventory');
            return data.tasks;
          }
          const rows = await list();
          const tasks = [];
          for (let i = 0; i < rows.length; i += 8) {
            tasks.push(...await Promise.all(rows.slice(i, i + 8).map(async row => {
              const task = await get('/' + row.id);
              if (task.id !== row.id || task.state !== row.state) throw new Error('Task list and detail disagree');
              return task;
            })));
          }
          const states = rows => rows.map(row => row.id + ':' + row.state).sort().join(',');
          if (states(rows) !== states(await list())) throw new Error('Task inventory changed');
          const acquiredAt = Date.parse('2026-11-23T06:02:50.607Z');
          const records = tasks.map(task => {
            const sessions = Array.isArray(task.sessions) ? task.sessions : [];
            const shape = Array.isArray(task.sessions) && task.session_count === sessions.length &&
              sessions.every(session => uuid(session.id) && session.task_id === task.id && known.has(session.state)) &&
              new Set(sessions.map(session => session.id)).size === sessions.length;
            const evidence = sessions.map(session => {
              const reasons = [];
              if (!uuid(session.id) || session.task_id !== task.id || !known.has(session.state)) reasons.push('invalid_identity_or_state');
              if (!stopped.has(session.state) && session.state !== 'idle') reasons.push('writer_session');
              if (typeof session.prompt !== 'string' || !session.prompt.trim()) reasons.push('missing_prompt');
              else if (session.prompt.split(/\r?\n/).some(line => line.trim() === marker)) reasons.push('lease_marker');
              return { id: uuid(session.id) ? session.id : null, state: known.has(session.state) ? session.state : 'unknown',
                predatesLease: Date.parse(session.created_at) < acquiredAt, reasons };
            });
            const normalWriter = (!stopped.has(task.state) && task.state !== 'idle') ||
              evidence.some(session => session.reasons.includes('writer_session'));
            const oldRecoveryRejects = !stopped.has(task.state) || !sessions.length ||
              evidence.some(session => !stopped.has(session.state) || session.reasons.includes('missing_prompt') || session.reasons.includes('lease_marker'));
            const idlePair = task.state === 'idle' && sessions.length > 0 && sessions.every(session => session.state === 'idle');
            return { id: task.id, state: task.state, shape, normalWriter, oldRecoveryRejects, idlePair, sessions: evidence };
          });
          console.log(JSON.stringify({ taskCount: records.length,
            badShape: records.filter(task => !task.shape).length,
            normalWriters: records.filter(task => task.normalWriter).length,
            firstOldRecoveryReject: records.find(task => task.oldRecoveryRejects)?.id ?? null,
            idlePairs: records.filter(task => task.idlePair).length,
            missingPromptRecords: records.filter(task => task.sessions.some(session => session.reasons.includes('missing_prompt'))).length,
            matchingRecords: records.filter(task => task.sessions.some(session => session.reasons.includes('lease_marker'))).length }));
          for (const task of records.filter(task => task.oldRecoveryRejects || !task.shape || task.normalWriter)) {
            console.log(JSON.stringify(task));
          }
          JS
