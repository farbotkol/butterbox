name: Phase 2 - autonomous Development merge

# Only Development. GitHub rulesets remain authoritative.
# Old Copilot PRs are deliberately excluded from this initial rollout.
on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pull_number:
        description: "Specific Development PR number; blank scans eligible PRs"
        required: false
        type: string
      dry_run:
        description: "Report decisions without updating branches or merging"
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/phase2-automerge-development.yml

permissions:
  contents: read

concurrency:
  group: phase2-dev-automerge
  cancel-in-progress: false

jobs:
  merge-ready-development:
    if: >-
      github.event_name != 'workflow_run' ||
      (contains(fromJSON('["pull_request","workflow_dispatch"]'), github.event.workflow_run.event) &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    steps:
      - name: Check eligibility and honor existing GitHub merge gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_PR: ${{ inputs.pull_number }}
          DRY_RUN: ${{ inputs.dry_run }}
          TRIGGER_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        shell: bash
        run: |
          set -euo pipefail
          # pull_request events only test policy; never mutate from an unmerged workflow.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            DRY_RUN=true
          elif [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            DRY_RUN=false
          fi
          echo "Phase 2 event=$EVENT_NAME dry_run=$DRY_RUN"

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$TARGET_PR" ]]; then
            [[ "$TARGET_PR" =~ ^[0-9]+$ ]] || { echo "::error::Invalid PR number"; exit 1; }
            numbers=("$TARGET_PR")
          elif [[ "$EVENT_NAME" == "workflow_run" ]]; then
            mapfile -t numbers < <(jq -r '(. // [])[] | .number' <<< "$TRIGGER_PRS")
            if (( ${#numbers[@]} == 0 )); then
              # Dispatched Verify runs have no pull_requests association.
              # Inspect open PRs instead; the exact HEAD and both checks are
              # verified below before any state change or merge request.
              echo "Verify finished without an associated PR; scanning eligible Development PRs."
              mapfile -t numbers < <(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].number')
            fi
          else
            mapfile -t numbers < <(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].number')
          fi

          for number in "${numbers[@]}"; do
            pr="$(gh api "repos/$REPO/pulls/$number")"
            if ! jq -e --arg repo "$REPO" '
              .state == "open"
              and .base.ref == "copilot/Development"
              and .head.repo.full_name == $repo
              and (.head.ref | startswith("copilot/"))
              and (
                (.number == 34 and .head.ref == "copilot/tokenless-agent-merge-probe")
                or (.number == 39 and .head.ref == "copilot/phase2-scheduled-smoke-20261107")
                or (.number == 43 and .head.ref == "copilot/e2e-smoke-20261108")
                or (
                  (.user.login | ascii_downcase) == "copilot"
                  and .created_at >= "2026-11-07T01:30:00Z"
                )
              )
            ' <<< "$pr" >/dev/null; then
              echo "PR #$number: outside the strictly scoped Phase 2 pilot."
              continue
            fi
            sha="$(jq -r '.head.sha' <<< "$pr")"
            draft="$(jq -r '.draft' <<< "$pr")"
            echo "Evaluating PR #$number at $sha (draft=$draft)."

            # Never trust check results from a previous commit or a non-Actions integration.
            checks="$(gh api "repos/$REPO/commits/$sha/check-runs?per_page=100&filter=latest")"
            for required in verify database; do
              if ! jq -e --arg name "$required" '
                # Check the newest matching run, not the number of successful runs.
                [.check_runs[] |
                  select(.name == $name and .app.slug == "github-actions")]
                | sort_by(.started_at // .created_at // "", .id)
                | last
                | . != null and .status == "completed" and .conclusion == "success"
              ' <<< "$checks" >/dev/null; then
                echo "PR #$number: $required is not successful on the latest HEAD."
                # GitHub may mark pull_request runs action_required after a bot-updated
                # branch. Explicitly dispatch CI once, but never bypass a failed test.
                if [[ "$DRY_RUN" != "true" ]]; then
                  runs="$(gh api "repos/$REPO/actions/runs?head_sha=$sha&per_page=50")"
                  if jq -e '
                    any(.workflow_runs[]; .name == "Verify"
                      and .event == "pull_request"
                      and .conclusion == "action_required")
                  ' <<< "$runs" >/dev/null &&
                  ! jq -e '
                    any(.workflow_runs[]; .name == "Verify"
                      and .event == "workflow_dispatch")
                  ' <<< "$runs" >/dev/null; then
                    branch="$(jq -r '.head.ref' <<< "$pr")"
                    echo "PR #$number: bot-triggered CI blocked; dispatching Verify for $branch."
                    gh api --method POST "repos/$REPO/actions/workflows/ci.yml/dispatches" \
                      -f ref="$branch" >/dev/null
                  fi
                fi
                continue 2
              fi
            done

            # Strict branch protection requires all base-branch commits in the PR head.
            base_sha="$(jq -r '.base.sha' <<< "$pr")"
            relation="$(gh api "repos/$REPO/compare/$base_sha...$sha")"
            behind="$(jq -r '.behind_by' <<< "$relation")"
            # compare BASE...HEAD: behind_by counts base commits absent from the PR head.
            if (( behind > 0 )); then
              echo "PR #$number: behind Development by $behind commits."
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "DRY RUN: would update branch and dispatch Verify."
              else
                if gh api --method PUT "repos/$REPO/pulls/$number/update-branch" \
                  -f expected_head_sha="$sha"; then
                  echo "PR #$number: branch update accepted; waiting for GitHub to apply it."
                  # GitHub processes update-branch asynchronously. Dispatching too
                  # early would validate the OLD SHA and leave the PR unchecked.
                  updated_sha=""
                  for attempt in {1..20}; do
                    current_sha="$(gh api "repos/$REPO/pulls/$number" --jq '.head.sha')"
                    if [[ "$current_sha" != "$sha" ]]; then
                      updated_sha="$current_sha"
                      break
                    fi
                    sleep 3
                  done
                  if [[ -z "$updated_sha" ]]; then
                    echo "::error::PR #$number: update not visible after 60 seconds. No CI dispatch."
                    exit 1
                  fi
                  echo "PR #$number: branch advanced from $sha to $updated_sha."
                  # REST dispatch needs no local Git repository.
                  branch="$(jq -r '.head.ref' <<< "$pr")"
                  gh api --method POST "repos/$REPO/actions/workflows/ci.yml/dispatches" \
                    -f ref="$branch" >/dev/null
                  echo "PR #$number: dispatched Verify on updated branch $branch."
                else
                  echo "::warning::PR #$number: branch update rejected by GitHub; not merging."
                fi
              fi
              continue
            fi

            # Fetch again after all gates to avoid merging an outdated SHA.
            latest="$(gh api "repos/$REPO/pulls/$number")"
            if [[ "$(jq -r '.head.sha' <<< "$latest")" != "$sha" ]]; then
              echo "PR #$number: branch changed during evaluation; retry on next run."
              continue
            fi

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "DRY RUN: would ready PR #$number and request GitHub native auto-merge."
              continue
            fi

            if [[ "$draft" == "true" ]]; then
              echo "PR #$number: marking draft ready for review."
              gh pr ready "$number" --repo "$REPO" || {
                echo "::warning::GitHub rejected ready transition for PR #$number."
                continue
              }
            fi

            # Native GitHub auto-merge, never a bypass or force push. GitHub
            # enforces every branch rule, approval and required status check.
            echo "PR #$number: enabling GitHub-native auto-merge."
            gh pr merge "$number" --repo "$REPO" --squash --auto || {
              echo "::warning::GitHub rejected merge for PR #$number; leaving open."
              continue
            }
          done
