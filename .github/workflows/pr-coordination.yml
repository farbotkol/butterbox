name: PR coordination

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [copilot/Development]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-coordination-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted Development policy
        uses: actions/checkout@v4
        with:
          # Always use the current trusted Development revision, not an old PR event base SHA.
          # Never execute code from the untrusted PR head in pull_request_target.
          ref: copilot/Development
          persist-credentials: false
      - name: Check declared work areas, changed files, and shared SQL objects
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node tools/agent-controller/check-pr-coordination.mjs
