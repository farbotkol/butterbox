name: Reconcile merged issue evidence

on:
  pull_request:
    types: [closed]
    branches: [copilot/Development]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read

concurrency:
  group: butterbox-single-writer-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconcile confirmed merges and recover missed events
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node tools/agent-evidence/reconcile.mjs
