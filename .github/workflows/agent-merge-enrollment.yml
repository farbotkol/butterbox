name: Copilot CLI CI repair (no stored token)

# Uses GitHub's native Copilot CLI authentication to attempt a bounded repair.
# GitHub documents built-in-token Copilot CLI billing for eligible ORGANIZATION repos.
# Butterbox is personally owned: auth smoke test must pass before relying on this workflow.
on:
  pull_request:
    paths:
      - .github/workflows/agent-merge-enrollment.yml
  workflow_run:
    workflows: ["Verify"]
    types: [completed]
  # A GITHUB_TOKEN-dispatched Verify doesn't reliably emit workflow_run.
  # Verify explicitly dispatches us again when a repaired test still fails.
  workflow_dispatch:
    inputs:
      verify_run_id:
        description: "Failed Verify run ID to authenticate and inspect"
        required: true
        type: string
      head_sha:
        description: "Failed Verify commit SHA"
        required: true
        type: string

permissions:
  contents: read

# One repair at a time prevents two agents racing to commit to the same PR.
concurrency:
  group: copilot-ci-test-repair-development
  cancel-in-progress: false

jobs:
  cli-auth-smoke:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 33
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Install Copilot CLI
        run: npm install --global @github/copilot
      - name: Check built-in-token Copilot authentication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -p "Respond with the single word AUTHENTICATED. Do not use tools." -s

  repair-failed-test:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'failure') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      actions: write
      copilot-requests: write
    steps:
      - name: Select eligible, latest failing Development PR
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_run_id || github.event.workflow_run.id }}
          PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          # Set repository Actions variable CI_REPAIR_MAX_ATTEMPTS to 1..5.
          # Missing variable defaults to 3; invalid values stop safely.
          MAX_ATTEMPTS: ${{ vars.CI_REPAIR_MAX_ATTEMPTS || '3' }}
        run: |
          set -euo pipefail
          if [[ ! "$MAX_ATTEMPTS" =~ ^[1-5]$ ]]; then
            echo "::error::CI_REPAIR_MAX_ATTEMPTS must be 1, 2, 3, 4, or 5."
            exit 1
          fi
          if [[ ! "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid failed-run SHA or ID."
            exit 1
          fi

          # Authenticate the event against GitHub's completed, failing Verify run.
          # A workflow_dispatch cannot nominate an arbitrary commit or successful run.
          failed_run="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          if ! jq -e --arg sha "$RUN_SHA" --arg repo "$REPO" --arg event "$EVENT_NAME" '
            .name == "Verify"
            and .head_sha == $sha
            and .head_repository.full_name == $repo
            and .status == "completed"
            and .conclusion == "failure"
            and (if $event == "workflow_dispatch" then .event == "workflow_dispatch"
                 else .event == "pull_request" end)
          ' <<< "$failed_run" >/dev/null; then
            echo "No matching completed, failing Verify run; exiting safely."
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            number=""
          else
            number="$(jq -r '.[0].number // empty' <<< "$PRS")"
          fi

          # Dispatched Verify runs have no pull request association. Resolve the
          # exact current HEAD to one open PR; never infer eligibility from branch alone.
          if [[ ! "$number" =~ ^[0-9]+$ ]]; then
            mapfile -t matching < <(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" |
              jq -r --arg repo "$REPO" --arg sha "$RUN_SHA" '
                .[] | select(.head.sha == $sha
                  and .head.repo.full_name == $repo
                  and .base.ref == "copilot/Development") | .number')
            if (( ${#matching[@]} != 1 )); then
              echo "Failed Verify SHA matches ${#matching[@]} open Development PRs; exiting safely."
              exit 0
            fi
            number="${matching[0]}"
          fi
          pr="$(gh api "repos/$REPO/pulls/$number")"
          if ! jq -e --arg repo "$REPO" --arg sha "$RUN_SHA" --argjson number "$number" '
            .number == $number
            and .state == "open"
            and .base.ref == "copilot/Development"
            and .head.repo.full_name == $repo
            and .head.sha == $sha
            and (
              ((.user.login | ascii_downcase) == "copilot" and (.head.ref | startswith("copilot/")))
              or ($number == 34 and .head.ref == "copilot/tokenless-agent-merge-probe")
            )
          ' <<< "$pr" >/dev/null; then
            echo "Not a current, eligible Development PR; exiting."
            exit 0
          fi
          # Count repair commits for this PR, including legacy single-attempt
          # commits. The count persists across workflow reruns and bot restarts.
          # Matching only bot-authored commits avoids counting unrelated messages.
          # --jq is applied to each API page, so count matches across all pages.
          attempted="$(gh api --paginate "repos/$REPO/pulls/$number/commits?per_page=100" \
            --jq '.[] | select(.author.login == "github-actions[bot]") | .commit.message' \
            | grep -F -c "ci: Copilot CLI bounded test repair (#$number)" || true)"
          if (( attempted >= MAX_ATTEMPTS )); then
            echo "::warning::PR #$number reached $attempted/$MAX_ATTEMPTS repair attempts. Stopping."
            exit 0
          fi
          attempt=$((attempted + 1))
          echo "PR #$number: repair attempt $attempt/$MAX_ATTEMPTS for failed Verify run $RUN_ID."
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "max_attempts=$MAX_ATTEMPTS" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r '.head.ref' <<< "$pr")" >> "$GITHUB_OUTPUT"

      - name: Checkout exact PR commit without persisted credentials
        if: steps.guard.outputs.eligible == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.guard.outputs.sha }}
          persist-credentials: false

      - name: Collect failed GitHub Actions logs (no PR scripts run)
        if: steps.guard.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_run_id || github.event.workflow_run.id }}
        run: gh run view "$RUN_ID" --log-failed > .agent-failed-ci.log

      - name: Install Copilot CLI
        if: steps.guard.outputs.eligible == 'true'
        run: npm install --global @github/copilot

      - name: Ask Copilot to repair a test file only
        if: steps.guard.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ steps.guard.outputs.attempt }}
          MAX_ATTEMPTS: ${{ steps.guard.outputs.max_attempts }}
        run: |
          copilot -p "This is CI self-repair attempt $ATTEMPT of $MAX_ATTEMPTS. Inspect the latest failures in .agent-failed-ci.log. This is an isolated CI self-repair proof of concept. Inspect the failures recorded in .agent-failed-ci.log and the repository tests. If the failure can be solved by correcting exactly ONE existing tests/*.test.mjs file, edit only that file. Do not change workflows, dependencies, product code, secrets, branch rules or existing unrelated tests. Do not execute code or shell commands; the runner will validate all changes separately. If a safe one-file repair is not possible, leave files unchanged and explain why." \
            -s --allow-tool=write --deny-tool=shell --deny-tool=url

      - name: Verify only one Node test file was edited and push one fix
        if: steps.guard.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.guard.outputs.number }}
          BRANCH: ${{ steps.guard.outputs.branch }}
          EXPECTED_SHA: ${{ steps.guard.outputs.sha }}
          ATTEMPT: ${{ steps.guard.outputs.attempt }}
          MAX_ATTEMPTS: ${{ steps.guard.outputs.max_attempts }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} != 1 )); then
            echo "::error::Expected exactly one modified test file; got ${#changed[@]}. No push."
            exit 1
          fi
          file="${changed[0]}"
          if [[ ! "$file" =~ ^tests/[a-zA-Z0-9_.-]+\.test\.mjs$ ]] ||
             [[ ! -f "$file" ]] || [[ -L "$file" ]]; then
            echo "::error::Disallowed changed path. No push."
            exit 1
          fi
          current_sha="$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.head.sha')"
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::PR has moved since the failing CI run. No push."
            exit 1
          fi
          blob_sha="$(gh api "repos/$REPO/contents/$file?ref=$BRANCH" --jq '.sha')"
          encoded="$(base64 -w0 < "$file")"
          gh api --method PUT "repos/$REPO/contents/$file" \
            -f message="ci: Copilot CLI bounded test repair (#$NUMBER) [attempt $ATTEMPT/$MAX_ATTEMPTS]" \
            -f branch="$BRANCH" \
            -f sha="$blob_sha" \
            -f content="$encoded" >/dev/null
          echo "Pushed one test-only repair to PR #$NUMBER."
          # GITHUB_TOKEN writes do not trigger pull_request/synchronize CI.
          # workflow_dispatch is an explicitly supported exception; verify whether
          # this dispatch supplies the required PR check contexts before merging.
          gh workflow run ci.yml --ref "$BRANCH"
          echo "Dispatched Verify against repaired branch. No auto-merge attempted."
