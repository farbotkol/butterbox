name: Copilot CLI CI repair (personal-account compatible)

# GitHub bills built-in-token Copilot CLI requests to the personal repository
# owner's Copilot seat. Verify entitlement with a tool-free model request.
on:
  pull_request:
    paths:
      - .github/workflows/agent-merge-enrollment.yml
  workflow_run:
    workflows: ["Verify"]
    types: [completed]
  # A GITHUB_TOKEN-dispatched Verify doesn't reliably emit workflow_run.
  # Verify explicitly dispatches us again when a repaired test still fails.
  workflow_dispatch:
    inputs:
      smoke_only:
        description: "Test built-in Copilot authentication without repairing a PR"
        type: boolean
        default: false
      models_probe:
        description: "Diagnose the historical GitHub Models response"
        type: boolean
        default: false
      repair_probe:
        description: "Exercise scoped Copilot on the preserved PR 336 checkout without publishing"
        type: boolean
        default: false
      verify_run_id:
        description: "Failed Verify run ID (required for repair)"
        type: string
      head_sha:
        description: "Failed Verify commit SHA (required for repair)"
        type: string

permissions:
  contents: read

# One repair at a time prevents two agents racing to commit to the same PR.
concurrency:
  group: copilot-ci-test-repair-development
  cancel-in-progress: false

jobs:
  models-connectivity:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_only == true && inputs.models_probe == true &&
      github.repository == 'farbotkol/butterbox' && github.actor_id == '11307166'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      models: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify structured GitHub Models evidence with the Actions identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { modelJson } from './tools/delivery-controller/product-acceptance.mjs';
          const result = await modelJson(
            'Assess the supplied synthetic fact. Return JSON with criterion (1), pass (boolean), and evidence (exact supplied check label).',
            { criterion: 'Is test-label green?', fact: 'test-label is green.' },
            { token: process.env.GITHUB_TOKEN, operation: 'GitHub Models connectivity probe',
              request: (url, options) => fetch(url, { ...options, redirect: 'error', signal: AbortSignal.timeout(15000) }) }
          );
          assert(result.criterion === 1 && result.pass === true && result.evidence === 'test-label',
            'GitHub Models did not return the expected structured evidence');
          console.log('GitHub Models connectivity and structured output verified');
          NODE

  repair-failed-test:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'failure') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      actions: write
      copilot-requests: write
    steps:
      - name: Select eligible, latest failing Development PR
        id: guard
        if: inputs.smoke_only != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_run_id || github.event.workflow_run.id }}
          PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          # Set repository Actions variable CI_REPAIR_MAX_ATTEMPTS to 1..5.
          # Missing variable defaults to 3; invalid values stop safely.
          MAX_ATTEMPTS: ${{ vars.CI_REPAIR_MAX_ATTEMPTS || '3' }}
        run: |
          set -euo pipefail
          if [[ ! "$MAX_ATTEMPTS" =~ ^[1-5]$ ]]; then
            echo "::error::CI_REPAIR_MAX_ATTEMPTS must be 1, 2, 3, 4, or 5."
            exit 1
          fi
          if [[ ! "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid failed-run SHA or ID."
            exit 1
          fi

          # A controller-owned cloud task is the exclusive coding writer.
          if [[ "$REPO" == "farbotkol/butterbox" ]]; then
            leases="$(gh api "repos/$REPO/git/matching-refs/tags/butterbox-controller-active")"
            if jq -e 'any(.[]; .ref == "refs/tags/butterbox-controller-active")' <<< "$leases" >/dev/null; then
              echo "The delivery controller lease is held. Skipping CI repair."
              exit 0
            fi
          fi

          # Authenticate the event against GitHub's completed, failing Verify run.
          # A workflow_dispatch cannot nominate an arbitrary commit or successful run.
          failed_run="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          if ! jq -e --arg sha "$RUN_SHA" --arg repo "$REPO" --arg event "$EVENT_NAME" '
            .name == "Verify"
            and .head_sha == $sha
            and .head_repository.full_name == $repo
            and .status == "completed"
            and .conclusion == "failure"
            and (if $event == "workflow_dispatch" then .event == "workflow_dispatch"
                 else .event == "pull_request" end)
          ' <<< "$failed_run" >/dev/null; then
            echo "No matching completed, failing Verify run; exiting safely."
            exit 0
          fi
          failed_jobs="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100&filter=latest")"
          if ! jq -e '
            any(.jobs[];
              .name == "verify"
              and .conclusion == "failure"
              and any(.steps[]; .name == "Run npm test" and .conclusion == "failure"))
          ' <<< "$failed_jobs" >/dev/null; then
            echo "Verify failed outside the Node test step; no test repair will run."
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            number=""
          else
            number="$(jq -r '.[0].number // empty' <<< "$PRS")"
          fi

          # Dispatched Verify runs have no pull request association. Resolve the
          # exact current HEAD to one open PR; never infer eligibility from branch alone.
          if [[ ! "$number" =~ ^[0-9]+$ ]]; then
            mapfile -t matching < <(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" |
              jq -r --arg repo "$REPO" --arg sha "$RUN_SHA" '
                .[] | select(.head.sha == $sha
                  and .head.repo.full_name == $repo
                  and .base.ref == "copilot/Development") | .number')
            if (( ${#matching[@]} != 1 )); then
              echo "Failed Verify SHA matches ${#matching[@]} open Development PRs; exiting safely."
              exit 0
            fi
            number="${matching[0]}"
          fi
          pr="$(gh api "repos/$REPO/pulls/$number")"
          if jq -e '(.body // "" | split("\n") | map(rtrimstr("\r"))) |
            index("<!-- butterbox-delivery: autonomous-development -->") != null' <<< "$pr" >/dev/null; then
            echo "Autonomous Development PR is handled by its leased controller."
            exit 0
          fi

          repo_owner="${REPO%%/*}"
          if ! jq -e --arg repo "$REPO" --arg owner "$repo_owner" --arg sha "$RUN_SHA" --argjson number "$number" '
            .number == $number
            and .state == "open"
            and .base.ref == "copilot/Development"
            and .head.repo.full_name == $repo
            and .head.sha == $sha
            and (
              ((.head.ref | startswith("copilot/"))
                and ((.user.login | ascii_downcase) == "copilot"
                  or (.user.login | ascii_downcase) == ($owner | ascii_downcase)))
              or ($number == 34 and .head.ref == "copilot/tokenless-agent-merge-probe")
            )
          ' <<< "$pr" >/dev/null; then
            echo "Not a current, eligible Development PR; exiting."
            exit 0
          fi
          created_at="$(jq -r '.created_at // empty' <<< "$pr")"
          if [[ -z "$created_at" ]] || ! created_epoch="$(date -u -d "$created_at" +%s 2>/dev/null)"; then
            echo "::error::PR creation time is unavailable; refusing an unbounded repair."
            exit 1
          fi
          elapsed=$(( $(date -u +%s) - created_epoch ))
          if (( elapsed >= 12 * 60 * 60 )); then
            echo "::warning::PARKED: PR #$number exceeded the 12-hour repair window; no further repair attempt will run."
            {
              echo "## CI repair parked"
              echo "PR #$number exceeded the 12-hour repair window."
              echo "Next action: owner/reviewer must inspect the failed Verify run and decide whether to restart the scoped task."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Count repair commits for this PR, including legacy single-attempt
          # commits. The count persists across workflow reruns and bot restarts.
          # Matching only bot-authored commits avoids counting unrelated messages.
          # --jq is applied to each API page, so count matches across all pages.
          repair_messages="$(gh api --paginate "repos/$REPO/pulls/$number/commits?per_page=100" \
            --jq '.[] | select(.author.login == "github-actions[bot]") | .commit.message')"
          attempted="$(awk -v marker="ci: Copilot CLI bounded test repair (#$number)" \
            'index($0, marker) == 1 { count++ } END { print count+0 }' <<< "$repair_messages")"
          if (( attempted >= MAX_ATTEMPTS )); then
            echo "::warning::PR #$number reached $attempted/$MAX_ATTEMPTS repair attempts. Stopping."
            exit 0
          fi
          attempt=$((attempted + 1))
          echo "PR #$number: repair attempt $attempt/$MAX_ATTEMPTS for failed Verify run $RUN_ID."
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "max_attempts=$MAX_ATTEMPTS" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r '.head.ref' <<< "$pr")" >> "$GITHUB_OUTPUT"

      - name: Install Copilot CLI
        if: inputs.smoke_only == true || steps.guard.outputs.eligible == 'true'
        working-directory: ${{ runner.temp }}
        run: npm install --global @github/copilot

      - name: Non-destructive Copilot authentication smoke test
        if: inputs.smoke_only == true || steps.guard.outputs.attempt == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d "$RUNNER_TEMP/copilot-auth-smoke.XXXXXX")"
          trap 'rm -rf -- "$smoke_dir"' EXIT
          cd "$smoke_dir"
          output="$smoke_dir/response"
          error="$smoke_dir/diagnostic"
          if copilot -p "Respond with exactly AUTHENTICATED. Do not use any tools." \
            -s --no-ask-user --disable-builtin-mcps --deny-tool=read --deny-tool=write --deny-tool=shell --deny-tool=url \
            >"$output" 2>"$error"; then
            :
          else
            exit_code=$?
            echo "::error::Copilot CLI authentication smoke test failed (exit $exit_code); sanitized CLI diagnostic follows."
            sed -E \
              -e 's/(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})/[REDACTED]/g' \
              -e 's/Bearer[[:space:]]+[^[:space:]]+/Bearer-REDACTED/Ig' \
              "$error" | tail -n 40
            exit 1
          fi
          if [[ "$(cat "$output")" != "AUTHENTICATED" ]]; then
            echo "::error::Copilot CLI authentication returned an unexpected response; no response or credentials were logged."
            exit 1
          fi
          echo "Copilot CLI authentication succeeded with no tools enabled."

      - uses: actions/checkout@v4
        if: inputs.smoke_only == true && github.repository == 'farbotkol/butterbox' && github.actor_id == '11307166'
        with:
          persist-credentials: false
      - name: Probe structured evidence from a separate tool-free Copilot session
        if: inputs.smoke_only == true && github.repository == 'farbotkol/butterbox' && github.actor_id == '11307166'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { verifyAssessmentConnectivity } from './tools/delivery-controller/copilot-cli.mjs';
          await verifyAssessmentConnectivity(process.env.GITHUB_TOKEN);
          console.log('Copilot CLI tool-free structured evidence verified');
          NODE

      - name: Probe isolated source repair with the preserved #84 CI failure
        if: always() && inputs.smoke_only == true && inputs.repair_probe == true && github.repository == 'farbotkol/butterbox' && github.actor_id == '11307166'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { copilotRepair } from './tools/delivery-controller/copilot-cli.mjs';
          import { downloadJobLog } from './tools/delivery-controller/job-log-download.mjs';
          import { repairDiagnostic } from './tools/delivery-controller/product-repair.mjs';
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const head = '7bea6b8517e3f8e80bebcf5b73415b74e05cf9d1';
          const diagnostic = repairDiagnostic(await downloadJobLog({ repository, token, jobId: 140139911055 }));
          assert(!diagnostic.infrastructure && diagnostic.text.includes('strict mode violation'),
            'Expected exact-head venue settings browser diagnostics');
          const files = await copilotRepair({ repository, token, head, diagnostic: diagnostic.text, attempt: 1,
            scope: { issue: 84, criteria: ['Provide a single save action for a venue and preserve the settings and audit behavior.'],
              paths: ['src/app/settings/organisation', 'src/app/actions.ts', 'src/components/venue-settings-form.tsx',
                'src/lib/venue-settings.ts', 'tests/venue-settings-save.test.mjs', 'tests/e2e', 'docs/USER_GUIDE.md'] } });
          assert(files && files.additions.some(file => file.path.startsWith('src/')),
            'Copilot produced no eligible application changes');
          console.log('Copilot returned scoped source edits in the disposable checkout.');
          NODE

      - name: Checkout trusted Development inventory policy
        if: github.repository == 'farbotkol/butterbox' && steps.guard.outputs.eligible == 'true'
        uses: actions/checkout@v4
        with:
          ref: copilot/Development
          persist-credentials: false

      - name: Verify cloud writer inventory before repair
        if: github.repository == 'farbotkol/butterbox' && steps.guard.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AGENT_USER_TOKEN: ${{ secrets.COPILOT_AGENT_USER_TOKEN }}
        run: node tools/delivery-controller/verify-writer-inventory.mjs

      - name: Checkout exact PR commit without persisted credentials
        if: steps.guard.outputs.eligible == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.guard.outputs.sha }}
          persist-credentials: false

      - name: Collect failed GitHub Actions logs (no PR scripts run)
        if: steps.guard.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_run_id || github.event.workflow_run.id }}
        run: gh run view "$RUN_ID" --log-failed > .agent-failed-ci.log

      - name: Ask Copilot to repair failing Node test files
        if: steps.guard.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ steps.guard.outputs.attempt }}
          MAX_ATTEMPTS: ${{ steps.guard.outputs.max_attempts }}
        run: |
          copilot -p "This is CI self-repair attempt $ATTEMPT of $MAX_ATTEMPTS. Inspect .agent-failed-ci.log and the repository tests. Correct as many clearly diagnosed failures as possible in EXISTING tests/*.test.mjs files, including MULTIPLE such files in this ONE attempt when necessary. Do not avoid a partial fix just because some failures may remain; CI will rerun and the bounded retry loop will handle remaining eligible failures. Do not modify anything outside existing tests/*.test.mjs files. Do not change workflows, dependencies, product code, secrets, branch rules or unrelated tests. Do not execute code or shell commands; the runner will validate all changes separately. If no safe eligible repair is possible, leave files unchanged and explain why." \
            -s --allow-tool=write --deny-tool=shell --deny-tool=url

      - name: Validate all edited Node test files and push one atomic repair
        if: steps.guard.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.guard.outputs.number }}
          BRANCH: ${{ steps.guard.outputs.branch }}
          EXPECTED_SHA: ${{ steps.guard.outputs.sha }}
          ATTEMPT: ${{ steps.guard.outputs.attempt }}
          MAX_ATTEMPTS: ${{ steps.guard.outputs.max_attempts }}
        run: |
          set -euo pipefail

          # HEAD includes staged and unstaged changes; only already tracked,
          # existing regular Node test files may enter a repair commit.
          mapfile -t changed < <(git diff --name-only HEAD)
          if (( ${#changed[@]} == 0 )); then
            echo "::error::Copilot made no tracked test changes. No push."
            exit 1
          fi
          mapfile -t untracked < <(git ls-files --others --exclude-standard)
          for path in "${untracked[@]}"; do
            if [[ "$path" != ".agent-failed-ci.log" ]]; then
              echo "::error::Unexpected untracked file; no push: $path"
              exit 1
            fi
          done
          for file in "${changed[@]}"; do
            if [[ ! "$file" =~ ^tests/[a-zA-Z0-9_.-]+\.test\.mjs$ ]] ||
               [[ ! -f "$file" ]] || [[ -L "$file" ]] ||
               ! git ls-files --error-unmatch -- "$file" >/dev/null 2>&1; then
              echo "::error::Disallowed modified file. No push: $file"
              exit 1
            fi
          done

          # Publish all approved edits as ONE Git commit via the Git Data API.
          # This is atomic for multiple files and cannot partially publish a
          # repair if a later file fails validation or its blob upload fails.
          current_sha="$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.head.sha')"
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::PR has moved since the failing CI run. No push."
            exit 1
          fi
          # Build Git Data API payloads with Python JSON serialization instead
          # of jq filters. Copilot's repair previously succeeded but the
          # publishing job failed compiling a jq expression.
          base_tree="$(gh api "repos/$REPO/git/commits/$EXPECTED_SHA" \
            --template '{{.tree.sha}}')"
          entries="$RUNNER_TEMP/ci-repair-entries.json"
          printf '[]\n' > "$entries"
          for file in "${changed[@]}"; do
            blob_sha="$(gh api --method POST "repos/$REPO/git/blobs" \
              -f encoding=base64 \
              -f "content=$(base64 -w0 < "$file")" \
              --template '{{.sha}}')"
            python3 - "$entries" "$file" "$blob_sha" <<'PY'
          import json
          import pathlib
          import sys
          
          path, filename, blob_sha = sys.argv[1:]
          entries = json.loads(pathlib.Path(path).read_text())
          entries.append({"path": filename, "mode": "100644", "type": "blob", "sha": blob_sha})
          pathlib.Path(path).write_text(json.dumps(entries))
          PY
          done

          python3 - "$base_tree" "$entries" "$RUNNER_TEMP/ci-repair-tree.json" <<'PY'
          import json
          import pathlib
          import sys
          
          base_tree, entries_file, output_file = sys.argv[1:]
          payload = {"base_tree": base_tree, "tree": json.loads(pathlib.Path(entries_file).read_text())}
          pathlib.Path(output_file).write_text(json.dumps(payload))
          PY
          tree_sha="$(gh api --method POST "repos/$REPO/git/trees" \
            --input "$RUNNER_TEMP/ci-repair-tree.json" \
            --template '{{.sha}}')"
          python3 - "ci: Copilot CLI bounded test repair (#$NUMBER) [attempt $ATTEMPT/$MAX_ATTEMPTS]" \
            "$tree_sha" "$EXPECTED_SHA" "$RUNNER_TEMP/ci-repair-commit.json" <<'PY'
          import json
          import pathlib
          import sys
          
          message, tree_sha, parent_sha, output_file = sys.argv[1:]
          payload = {"message": message, "tree": tree_sha, "parents": [parent_sha]}
          pathlib.Path(output_file).write_text(json.dumps(payload))
          PY
          commit_sha="$(gh api --method POST "repos/$REPO/git/commits" \
            --input "$RUNNER_TEMP/ci-repair-commit.json" \
            --template '{{.sha}}')"

          # GitHub refuses non-fast-forward ref updates without force=true.
          # Keep force disabled and refuse to overwrite concurrent PR changes.
          current_sha="$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.head.sha')"
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::PR moved while preparing repair commit. No push."
            exit 1
          fi
          gh api --method PATCH "repos/$REPO/git/refs/heads/$BRANCH" \
            -f sha="$commit_sha" -F force=false >/dev/null
          echo "Pushed one atomic repair commit covering ${#changed[@]} existing test file(s) on PR #$NUMBER."
          # GITHUB_TOKEN commits do not trigger synchronize runs. Explicit
          # dispatches rerun both current required checks on the repaired SHA.
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run fast-database-candidate.yml --ref "$BRANCH"
          echo "Dispatched Verify and database-smoke against repaired branch; no direct merge attempted."
