name: Copilot CLI CI repair (no stored token)

# Uses GitHub's native Copilot CLI authentication to attempt a bounded repair.
# GitHub documents built-in-token Copilot CLI billing for eligible ORGANIZATION repos.
# Butterbox is personally owned: auth smoke test must pass before relying on this workflow.
on:
  pull_request:
    paths:
      - .github/workflows/agent-merge-enrollment.yml
  workflow_run:
    workflows: ["Verify"]
    types: [completed]
  # A GITHUB_TOKEN-dispatched Verify doesn't reliably emit workflow_run.
  # Verify explicitly dispatches us again when a repaired test still fails.
  workflow_dispatch:
    inputs:
      verify_run_id:
        description: "Failed Verify run ID to authenticate and inspect"
        required: true
        type: string
      head_sha:
        description: "Failed Verify commit SHA"
        required: true
        type: string

permissions:
  contents: read

# One repair at a time prevents two agents racing to commit to the same PR.
concurrency:
  group: copilot-ci-test-repair-development
  cancel-in-progress: false

jobs:
  cli-auth-smoke:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 33
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Install Copilot CLI
        run: npm install --global @github/copilot
      - name: Check built-in-token Copilot authentication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot -p "Respond with the single word AUTHENTICATED. Do not use tools." -s

  repair-failed-test:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'failure') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      actions: write
      copilot-requests: write
    steps:
      - name: Select eligible, latest failing Development PR
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_run_id || github.event.workflow_run.id }}
          PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          # Set repository Actions variable CI_REPAIR_MAX_ATTEMPTS to 1..5.
          # Missing variable defaults to 3; invalid values stop safely.
          MAX_ATTEMPTS: ${{ vars.CI_REPAIR_MAX_ATTEMPTS || '3' }}
        run: |
          set -euo pipefail
          if [[ ! "$MAX_ATTEMPTS" =~ ^[1-5]$ ]]; then
            echo "::error::CI_REPAIR_MAX_ATTEMPTS must be 1, 2, 3, 4, or 5."
            exit 1
          fi
          if [[ ! "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid failed-run SHA or ID."
            exit 1
          fi

          # Authenticate the event against GitHub's completed, failing Verify run.
          # A workflow_dispatch cannot nominate an arbitrary commit or successful run.
          failed_run="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          if ! jq -e --arg sha "$RUN_SHA" --arg repo "$REPO" --arg event "$EVENT_NAME" '
            .name == "Verify"
            and .head_sha == $sha
            and .head_repository.full_name == $repo
            and .status == "completed"
            and .conclusion == "failure"
            and (if $event == "workflow_dispatch" then .event == "workflow_dispatch"
                 else .event == "pull_request" end)
          ' <<< "$failed_run" >/dev/null; then
            echo "No matching completed, failing Verify run; exiting safely."
            exit 0
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            number=""
          else
            number="$(jq -r '.[0].number // empty' <<< "$PRS")"
          fi

          # Dispatched Verify runs have no pull request association. Resolve the
          # exact current HEAD to one open PR; never infer eligibility from branch alone.
          if [[ ! "$number" =~ ^[0-9]+$ ]]; then
            mapfile -t matching < <(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" |
              jq -r --arg repo "$REPO" --arg sha "$RUN_SHA" '
                .[] | select(.head.sha == $sha
                  and .head.repo.full_name == $repo
                  and .base.ref == "copilot/Development") | .number')
            if (( ${#matching[@]} != 1 )); then
              echo "Failed Verify SHA matches ${#matching[@]} open Development PRs; exiting safely."
              exit 0
            fi
            number="${matching[0]}"
          fi
          pr="$(gh api "repos/$REPO/pulls/$number")"
          if ! jq -e --arg repo "$REPO" --arg sha "$RUN_SHA" --argjson number "$number" '
            .number == $number
            and .state == "open"
            and .base.ref == "copilot/Development"
            and .head.repo.full_name == $repo
            and .head.sha == $sha
            and (
              ((.user.login | ascii_downcase) == "copilot" and (.head.ref | startswith("copilot/")))
              or ($number == 34 and .head.ref == "copilot/tokenless-agent-merge-probe")
            )
          ' <<< "$pr" >/dev/null; then
            echo "Not a current, eligible Development PR; exiting."
            exit 0
          fi
          # Count repair commits for this PR, including legacy single-attempt
          # commits. The count persists across workflow reruns and bot restarts.
          # Matching only bot-authored commits avoids counting unrelated messages.
          # --jq is applied to each API page, so count matches across all pages.
          repair_messages="$(gh api --paginate "repos/$REPO/pulls/$number/commits?per_page=100" \
            --jq '.[] | select(.author.login == "github-actions[bot]") | .commit.message')"
          attempted="$(awk -v marker="ci: Copilot CLI bounded test repair (#$number)" \
            'index($0, marker) == 1 { count++ } END { print count+0 }' <<< "$repair_messages")"
          if (( attempted >= MAX_ATTEMPTS )); then
            echo "::warning::PR #$number reached $attempted/$MAX_ATTEMPTS repair attempts. Stopping."
            exit 0
          fi
          attempt=$((attempted + 1))
          echo "PR #$number: repair attempt $attempt/$MAX_ATTEMPTS for failed Verify run $RUN_ID."
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "max_attempts=$MAX_ATTEMPTS" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r '.head.ref' <<< "$pr")" >> "$GITHUB_OUTPUT"

      - name: Checkout exact PR commit without persisted credentials
        if: steps.guard.outputs.eligible == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.guard.outputs.sha }}
          persist-credentials: false

      - name: Collect failed GitHub Actions logs (no PR scripts run)
        if: steps.guard.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_run_id || github.event.workflow_run.id }}
        run: gh run view "$RUN_ID" --log-failed > .agent-failed-ci.log

      - name: Install Copilot CLI
        if: steps.guard.outputs.eligible == 'true'
        run: npm install --global @github/copilot

      - name: Ask Copilot to repair failing Node test files
        if: steps.guard.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ steps.guard.outputs.attempt }}
          MAX_ATTEMPTS: ${{ steps.guard.outputs.max_attempts }}
        run: |
          copilot -p "This is CI self-repair attempt $ATTEMPT of $MAX_ATTEMPTS. Inspect .agent-failed-ci.log and the repository tests. Correct as many clearly diagnosed failures as possible in EXISTING tests/*.test.mjs files, including MULTIPLE such files in this ONE attempt when necessary. Do not avoid a partial fix just because some failures may remain; CI will rerun and the bounded retry loop will handle remaining eligible failures. Do not modify anything outside existing tests/*.test.mjs files. Do not change workflows, dependencies, product code, secrets, branch rules or unrelated tests. Do not execute code or shell commands; the runner will validate all changes separately. If no safe eligible repair is possible, leave files unchanged and explain why." \
            -s --allow-tool=write --deny-tool=shell --deny-tool=url

      - name: Validate all edited Node test files and push one atomic repair
        if: steps.guard.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.guard.outputs.number }}
          BRANCH: ${{ steps.guard.outputs.branch }}
          EXPECTED_SHA: ${{ steps.guard.outputs.sha }}
          ATTEMPT: ${{ steps.guard.outputs.attempt }}
          MAX_ATTEMPTS: ${{ steps.guard.outputs.max_attempts }}
        run: |
          set -euo pipefail

          # HEAD includes staged and unstaged changes; only already tracked,
          # existing regular Node test files may enter a repair commit.
          mapfile -t changed < <(git diff --name-only HEAD)
          if (( ${#changed[@]} == 0 )); then
            echo "::error::Copilot made no tracked test changes. No push."
            exit 1
          fi
          mapfile -t untracked < <(git ls-files --others --exclude-standard)
          for path in "${untracked[@]}"; do
            if [[ "$path" != ".agent-failed-ci.log" ]]; then
              echo "::error::Unexpected untracked file; no push: $path"
              exit 1
            fi
          done
          for file in "${changed[@]}"; do
            if [[ ! "$file" =~ ^tests/[a-zA-Z0-9_.-]+\.test\.mjs$ ]] ||
               [[ ! -f "$file" ]] || [[ -L "$file" ]] ||
               ! git ls-files --error-unmatch -- "$file" >/dev/null 2>&1; then
              echo "::error::Disallowed modified file. No push: $file"
              exit 1
            fi
          done

          # Publish all approved edits as ONE Git commit via the Git Data API.
          # This is atomic for multiple files and cannot partially publish a
          # repair if a later file fails validation or its blob upload fails.
          current_sha="$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.head.sha')"
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::PR has moved since the failing CI run. No push."
            exit 1
          fi
          # Build Git Data API payloads with Python JSON serialization instead
          # of jq filters. Copilot's repair previously succeeded but the
          # publishing job failed compiling a jq expression.
          base_tree="$(gh api "repos/$REPO/git/commits/$EXPECTED_SHA" \
            --template '{{.tree.sha}}')"
          entries="$RUNNER_TEMP/ci-repair-entries.json"
          printf '[]\n' > "$entries"
          for file in "${changed[@]}"; do
            blob_sha="$(gh api --method POST "repos/$REPO/git/blobs" \
              -f encoding=base64 \
              -f "content=$(base64 -w0 < "$file")" \
              --template '{{.sha}}')"
            python3 - "$entries" "$file" "$blob_sha" <<'PY'
import json
import pathlib
import sys

path, filename, blob_sha = sys.argv[1:]
entries = json.loads(pathlib.Path(path).read_text())
entries.append({"path": filename, "mode": "100644", "type": "blob", "sha": blob_sha})
pathlib.Path(path).write_text(json.dumps(entries))
PY
          done

          python3 - "$base_tree" "$entries" "$RUNNER_TEMP/ci-repair-tree.json" <<'PY'
import json
import pathlib
import sys

base_tree, entries_file, output_file = sys.argv[1:]
payload = {"base_tree": base_tree, "tree": json.loads(pathlib.Path(entries_file).read_text())}
pathlib.Path(output_file).write_text(json.dumps(payload))
PY
          tree_sha="$(gh api --method POST "repos/$REPO/git/trees" \
            --input "$RUNNER_TEMP/ci-repair-tree.json" \
            --template '{{.sha}}')"
          python3 - "ci: Copilot CLI bounded test repair (#$NUMBER) [attempt $ATTEMPT/$MAX_ATTEMPTS]" \
            "$tree_sha" "$EXPECTED_SHA" "$RUNNER_TEMP/ci-repair-commit.json" <<'PY'
import json
import pathlib
import sys

message, tree_sha, parent_sha, output_file = sys.argv[1:]
payload = {"message": message, "tree": tree_sha, "parents": [parent_sha]}
pathlib.Path(output_file).write_text(json.dumps(payload))
PY
          commit_sha="$(gh api --method POST "repos/$REPO/git/commits" \
            --input "$RUNNER_TEMP/ci-repair-commit.json" \
            --template '{{.sha}}')"

          # GitHub refuses non-fast-forward ref updates without force=true.
          # Keep force disabled and refuse to overwrite concurrent PR changes.
          current_sha="$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.head.sha')"
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::PR moved while preparing repair commit. No push."
            exit 1
          fi
          gh api --method PATCH "repos/$REPO/git/refs/heads/$BRANCH" \
            -f sha="$commit_sha" -F force=false >/dev/null
          echo "Pushed one atomic repair commit covering ${#changed[@]} existing test file(s) on PR #$NUMBER."
          # GITHUB_TOKEN commits do not trigger synchronize runs. Explicit
          # workflow_dispatch retries the full Verify gate.
          gh workflow run ci.yml --ref "$BRANCH"
          echo "Dispatched Verify against repaired branch; no direct merge attempted."
