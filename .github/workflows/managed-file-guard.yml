name: Managed file guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled]
    branches: [copilot/Development]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: managed-file-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check PR file scope using trusted base-branch code
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node tools/agent-evidence/check-managed-files.mjs
