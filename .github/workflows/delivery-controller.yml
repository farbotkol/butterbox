name: Butterbox action-based delivery controller (phase 1)

# Conservative first stage: actions, not imaginary coding sessions.
# GitHub's native rules and existing merge workflow remain authoritative.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/delivery-controller.yml
      - tools/delivery-controller/**
      - tests/delivery-controller-actions.test.mjs
      - tests/delivery-controller-dependencies.test.mjs
      - tests/delivery-controller-lease.test.mjs
      - tests/delivery-controller-live-gate.test.mjs
      - tests/delivery-controller-autonomy.test.mjs
      - tests/delivery-controller-handoff.test.mjs

permissions:
  contents: read

concurrency:
  group: butterbox-delivery-controller
  cancel-in-progress: false

jobs:
  policy-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test tests/delivery-controller-actions.test.mjs tests/delivery-controller-dependencies.test.mjs tests/delivery-controller-lease.test.mjs tests/delivery-controller-live-gate.test.mjs tests/delivery-controller-autonomy.test.mjs tests/delivery-controller-handoff.test.mjs

  act:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/Development
          persist-credentials: false
      - name: Capture current Development PR snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls?state=open&per_page=100" > "$RUNNER_TEMP/open-prs.json"
          # Refuse decisions on an incomplete first page; prevent missing other writers.
          count="$(jq 'length' "$RUNNER_TEMP/open-prs.json")"
          if (( count >= 100 )); then
            echo "::error::PR query may be truncated; aborting."
            exit 1
          fi
          # List-pulls responses omit mergeable; load the detailed PR object.
          if (( count == 1 )); then
            number="$(jq -r '.[0].number' "$RUNNER_TEMP/open-prs.json")"
            [[ "$number" =~ ^[1-9][0-9]*$ ]] || exit 1
            gh api "repos/$REPO/pulls/$number" |
              jq -s '{pullRequests: .}' > "$RUNNER_TEMP/snapshot.json"
          else
            jq '{pullRequests: .}' "$RUNNER_TEMP/open-prs.json" > "$RUNNER_TEMP/snapshot.json"
          fi
      - name: Read live exclusive lease (read-only; fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node tools/delivery-controller/observe-lease.mjs "$RUNNER_TEMP/live-lease.json"
      - name: Choose guarded action
        id: decision
        run: node tools/delivery-controller/run.mjs "$RUNNER_TEMP/snapshot.json" "$RUNNER_TEMP/live-lease.json"
      - name: Request existing native merge gate
        if: steps.decision.outputs.action == 'REQUEST_GUARDED_MERGE'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.decision.outputs.pr }}
          SHA: ${{ steps.decision.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ && "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          current="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          if [[ "$current" != "$SHA" ]]; then
            echo "PR head changed, skipping; next controller run will re-evaluate."
            exit 0
          fi
          gh workflow run phase2-automerge-development.yml --repo "$REPO" \
            --ref copilot/Development -f pull_number="$PR" -f dry_run=false
          echo "Requested guarded merge evaluation for PR #$PR on $SHA." >> "$GITHUB_STEP_SUMMARY"

  autonomous-dispatch:
    # Disabled by default. The owner must explicitly enable the repository variable
    # and supply a user-to-server Copilot token as a GitHub Actions secret.
    needs: act
    if: github.event_name != 'pull_request' && needs.act.result == 'success' && vars.BUTTERBOX_AUTONOMY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/Development
          persist-credentials: false
      - name: Select, acquire lease, launch and verify real Copilot task
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AGENT_USER_TOKEN: ${{ secrets.COPILOT_AGENT_USER_TOKEN }}
          BUTTERBOX_AUTONOMY_ENABLED: ${{ vars.BUTTERBOX_AUTONOMY_ENABLED }}
        run: node tools/delivery-controller/run-autonomy.mjs
