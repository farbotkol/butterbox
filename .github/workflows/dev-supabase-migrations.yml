name: Deploy Supabase migrations - Development

# Only a successful, confirmed GitHub deployment of the Development commit
# may trigger database changes. No schedules and no merge-workflow trigger.
# The deployment provider must publish GitHub deployment_status events.
on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: supabase-development-migrations
  cancel-in-progress: false

jobs:
  deploy-migrations:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview' &&
      github.event.deployment.ref == 'copilot/Development'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: butterbox-development
    steps:
      - name: Check out the successfully deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify successful deployment belongs to Development
        env:
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          DEPLOY_STATE: ${{ github.event.deployment_status.state }}
          DEPLOY_ENV: ${{ github.event.deployment.environment }}
          DEPLOY_REF: ${{ github.event.deployment.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_STATE" == "success" ]] || exit 1
          [[ "$DEPLOY_ENV" == "Preview" ]] || exit 1
          [[ "$DEPLOY_REF" == "copilot/Development" ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_SHA" ]] || exit 1
          git fetch --no-tags origin refs/heads/copilot/Development
          git merge-base --is-ancestor "$DEPLOY_SHA" FETCH_HEAD || {
            echo "::error::Successful deployment SHA is not in Development."
            exit 1
          }
          test -f supabase/config.toml
          test -d supabase/migrations
          echo "Deploying only migrations present in confirmed deployed Development SHA $DEPLOY_SHA."

      - name: Confirm required deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in the butterbox-development environment."
            exit 1
          fi

      - name: Link only the Butterbox Development database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --yes supabase@2.122.0 link --project-ref crnstaknwervwjvbtabp

      - name: Apply pending migrations from the successfully deployed revision
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --yes supabase@2.122.0 db push --linked --yes

      - name: Report verified deployment commit
        env:
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: |
          echo "Butterbox Development Supabase migrations reconciled for deployed SHA $DEPLOY_SHA."
          echo "Database target: crnstaknwervwjvbtabp (Development only)."
