name: Nightly full regression

# GitHub schedules execute on the repository default branch (copilot/Development).
# 15:00 UTC is 02:00 AEDT / 01:00 AEST in Melbourne. GitHub cron may start late.
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Optional exact 40-character release candidate commit SHA to validate"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.ref }}-${{ inputs.release_sha || 'scheduled' }}
  cancel-in-progress: false

jobs:
  full-regression:
    name: full-regression
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Validate optional release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_SHA" && ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::release_sha must be a complete 40-character commit SHA."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false
      - name: Record exact tested commit
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "### Full regression" >> "$GITHUB_STEP_SUMMARY"
          echo "Tested commit: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Invocation: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: npm
      - run: npm ci
      - name: Start isolated disposable Supabase
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! npx --yes supabase@2.122.0 start --exclude studio,realtime,storage-api,imgproxy,postgres-meta,edge-runtime,logflare,vector,supavisor >"$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "::error::Disposable Supabase startup failed."
            tail -n 80 "$RUNNER_TEMP/supabase-start.log" || true
            exit 1
          fi
      - name: Complete database SQL regression
        run: npx --yes supabase@2.122.0 test db supabase/tests/database --local
      - name: Complete authenticated tenant isolation
        run: BUTTERBOX_TEST_DISPOSABLE=yes node scripts/test-tenant-isolation.mjs .
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Complete authenticated browser regression
        env:
          BUTTERBOX_TEST_REPORT_DIR: ${{ runner.temp }}/playwright
        run: BUTTERBOX_TEST_DISPOSABLE=yes npm run test:auth -- .
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/playwright
          retention-days: 14
          if-no-files-found: ignore
